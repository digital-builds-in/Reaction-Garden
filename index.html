<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#faf6ee;--c:#fff;--ink:#17171a;--mut:#7a766c;--teal:#0f766e;--sun:#fff0b8;--sb:#e9b000;--lav:#ece6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15161a;--c:#202228;--ink:#f3efe6;--mut:#a29d92;--teal:#5eead4;--sun:#3a3320;--lav:#2b2842}}
:root[data-theme=dark]{--bg:#15161a;--c:#202228;--ink:#f3efe6;--mut:#a29d92;--teal:#5eead4;--sun:#3a3320;--lav:#2b2842}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 6%,rgba(233,176,0,.14),transparent 38%),radial-gradient(circle at 92% 18%,rgba(15,118,110,.12),transparent 38%),var(--bg)}
.hand{font-family:Caveat,"Comic Sans MS",cursive;color:var(--teal);font-size:1.25rem}
header{text-align:center;padding:46px 18px 22px;position:relative;overflow:hidden}
h1{font-weight:800;font-size:clamp(2.3rem,9vw,4rem);letter-spacing:-.03em;line-height:1.05}
.sub{max-width:480px;margin:10px auto 0;color:var(--mut);font-size:.92rem;line-height:1.6}
.fl{position:absolute;font-size:1.9rem;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
.sq path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s .3s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.pg{max-width:300px;margin:20px auto 6px;height:10px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:var(--c)}
.pg i{display:block;height:100%;width:0;background:var(--teal);transition:width .7s cubic-bezier(.2,.8,.2,1)}
#cnt{font-size:.78rem;color:var(--mut)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 16px 26px}
.chips button,.ctl button,.done,#cv{font:600 .8rem Poppins,system-ui,sans-serif;border:2px solid var(--ink);background:var(--c);color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer;transition:.25s}
.chips button.on,#cv.on{background:var(--ink);color:var(--bg)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:26px;align-items:start;max-width:1180px;margin:auto;padding:0 16px 40px}
.gh{margin-bottom:14px}.gh h2{font-size:1.2rem;font-weight:800}.ge{font-size:1.7rem}
.rx{background:var(--c);border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);margin-bottom:24px;overflow:hidden;opacity:0;transform:translateY(20px);transition:.8s cubic-bezier(.2,.8,.2,1)}
.rx.in{opacity:1;transform:none}
.rx>summary{list-style:none;padding:16px 18px;cursor:pointer}
.rx>summary::-webkit-details-marker{display:none}
.n{font-size:.68rem;font-weight:600;letter-spacing:.14em;color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between}
.top b{font-size:1.45rem;font-weight:800}
.em{font-size:1.7rem;transition:transform .4s}.rx:hover .em{transform:rotate(-14deg) scale(1.18)}
.eq{margin-top:12px;padding:12px 8px;background:var(--bg);border-radius:14px;font-weight:600;font-size:.92rem;display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;align-items:center;text-align:center}
.ar{display:inline-flex;flex-direction:column;align-items:center;font-size:.62rem;color:var(--teal);line-height:1}
.ar i{font-style:normal}.ar b{font-size:1.5rem;line-height:.9}
.tap{display:block;margin-top:6px;font-size:1.1rem}.rx[open] .tap{display:none}
.bd{padding:2px 18px 18px;display:grid;gap:16px}
.rx[open] .bd>*{animation:up .6s both}.rx[open] .bd>:nth-child(2){animation-delay:.1s}.rx[open] .bd>:nth-child(3){animation-delay:.2s}.rx[open] .bd>:nth-child(n+4){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
h4{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:7px}
.bd p,.bd li{font-size:.9rem;line-height:1.65}
.note{background:var(--sun);border-left:5px solid var(--sb);padding:12px 14px;border-radius:4px 14px 14px 4px}
ol{list-style:none;counter-reset:s;display:grid;gap:9px;padding:0}
ol li{counter-increment:s;padding-left:34px;position:relative}
ol li::before{content:counter(s);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--bg);display:grid;place-items:center;font-size:.75rem;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none}
.tags li{font-size:.8rem;padding:5px 12px;border-radius:99px;background:var(--lav)}.tags li::before{content:"✓ ";color:var(--teal);font-weight:600}
.ex{margin-top:10px;color:var(--mut);font-size:.82rem!important}
.sc{height:190px;perspective:650px;border-radius:16px;background:var(--lav);position:relative;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;margin-bottom:6px}
.mol{position:absolute;inset:0;transform-style:preserve-3d}
.at{position:absolute;left:50%;top:50%;border-radius:50%;display:grid;place-items:center;font:600 .78rem Poppins,sans-serif;box-shadow:inset -4px -6px 10px rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.15)}
.ctl{display:flex;gap:10px;align-items:center}.ctl input{flex:1;accent-color:var(--teal)}.ctl button{padding:5px 12px}
.cap{font-family:Caveat,cursive;font-size:1.15rem;text-align:center;color:var(--teal);min-height:1.5em;margin:4px 0 10px}
.ch{position:absolute;left:50%;top:50%;max-width:130px;padding:8px 12px;border-radius:14px;color:#fff;font:600 .7rem/1.3 Poppins,sans-serif;text-align:center;box-shadow:0 8px 14px rgba(0,0,0,.18)}
.q summary{cursor:pointer;font-weight:600;font-size:.88rem}.q p{margin-top:6px}
footer{text-align:center;padding:10px 16px 36px}
.hook,.trap{padding:10px 14px;border-radius:4px 14px 14px 4px}
.hook{background:var(--lav);border-left:5px solid var(--teal)}
.trap{background:#ffe3e0;color:#5a1a14;border-left:5px solid #d6453a}.trap h4{color:#b3261e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .trap{background:#3b1f1d;color:#ffd9d4}:root:not([data-theme=light]) .trap h4{color:#ff9d93}}
:root[data-theme=dark] .trap{background:#3b1f1d;color:#ffd9d4}:root[data-theme=dark] .trap h4{color:#ff9d93}
.cov .eq span:last-child{filter:blur(9px);cursor:pointer;transition:.3s}.cov .eq span:last-child.rv{filter:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rx{opacity:1;transform:none}.sq path{stroke-dashoffset:0}}
</style></head><body>

<script>
const G=[["🔄","Swap the halogen","same carbon, new halogen"],["🧱","Join the pieces","snap two fragments into one"],["⚗️","Carbonyl tricks","C=O is the hotspot"],["🌸","Phenol & benzene","the ring has feelings too"],["💎","Amines & diazonium","nitrogen steals the show"],["🕵️","Lab detectives","colour, smell, precipitate"]];
const R=[
{g:0,e:"🔁",n:"Finkelstein",eq:["R–X + NaI","dry acetone","R–I + NaX↓"],ex:"CH₃CH₂Br + NaI → CH₃CH₂I + NaBr↓",
f:"Picture Br holding the carbon's hand. Iodide walks up with a better offer and taps in from the <b>opposite side</b>, so Br gets nudged out. The trick: acetone <i>welcomes</i> NaI but <i>rejects</i> NaBr, so NaBr drops out as a solid and nobody can walk back in. 🚪",
s:["<b>Approach 🚗</b> I⁻ attacks carbon from the back, directly opposite Br.","<b>Transition state ⚖️</b> Carbon is half-bonded to both I and Br while the other three groups flatten like an umbrella in the wind.","<b>Flip ☂️</b> Br⁻ leaves and the umbrella snaps inside-out (Walden inversion). NaBr crashes out, so the reaction cannot reverse."],
r:["X = Cl or Br","Works best with 1° halides (S<sub>N</sub>2)","Acetone must be <b>dry</b>"],q:"Why dry acetone?",a:"Water dissolves NaBr and NaCl, so nothing precipitates and the reaction can run backwards.",m:[["I","#7c3aed"],["Br","#c2410c"]]},
{g:0,e:"⚡",n:"Swarts",eq:["R–X + AgF","AgF · Hg₂F₂ · CoF₂ · SbF₃","R–F + AgX↓"],ex:"CH₃Br + AgF → CH₃F + AgBr↓",
f:"Getting fluorine onto carbon is awkward: F₂ is far too violent and NaF is sluggish. So we hire a <b>metal fluoride</b> (AgF, Hg₂F₂, CoF₂, SbF₃). The metal tugs the old halogen off like a magnet while F⁻ slips in. Same swap, different guest. 🧲",
s:["<b>Pull 🧲</b> The metal ion (Ag⁺, Hg⁺, Sb³⁺) grips the halogen and loosens the C–X bond.","<b>Push ➡️</b> F⁻ attacks carbon from the back (S<sub>N</sub>2).","<b>Lock 🔒</b> The metal halide precipitates, locking in the strong C–F bond."],
r:["Reagents: AgF, Hg₂F₂, CoF₂, SbF₃","Makes alkyl fluorides","Freon-12: 3CCl₄ + 2SbF₃ → 3CCl₂F₂ + 2SbCl₃ (SbCl₅ cat.)"],q:"Why not just use F₂?",a:"Direct fluorination is violently exothermic and wrecks the carbon chain; Swarts is a gentle exchange.",m:[["F","#0d9488"],["Br","#c2410c"]]},
{g:1,e:"🔗",n:"Wurtz",eq:["2R–X + 2Na","dry ether","R–R + 2NaX"],ex:"2CH₃Br + 2Na → CH₃–CH₃ + 2NaBr",
f:"Sodium loves giving electrons away. Hand one to R–Br and carbon ends up with a spare electron pair: an electron-rich <b>R⁻</b> (a nucleophile, not an electrophile!). It attacks a second R–Br, kicks out Br⁻, and the two R groups click together like LEGO. 🧩",
s:["<b>Donate ⚡</b> Na gives an electron: R–X → R–Na (a carbanion-like R⁻).","<b>Attack 🎯</b> R⁻ hits a second R–X from the back (S<sub>N</sub>2), pushing X⁻ out.","<b>Click 🔗</b> A new C–C bond forms and NaX drops out. The chain doubles."],
r:["Dry ether (Na reacts with water)","Same halide → even-carbon alkane","Mixed halides → mixture of 3 alkanes","Cannot make methane"],q:"Why can Wurtz not make methane?",a:"It joins two R groups, so the smallest product is ethane (R = CH₃).",m:[["R","#0f766e"],["Br","#c2410c"]]},
{g:1,e:"🌉",n:"Williamson Ether",eq:["R–ONa + R′–X","heat","R–O–R′ + NaX"],ex:"CH₃CH₂ONa + CH₃CH₂Br → CH₃CH₂OCH₂CH₃ + NaBr",
f:"Alkoxide (RO⁻) is an oxygen with extra electrons and nowhere to put them. It spots a carbon wearing a leaving halide, swings in from behind, and oxygen becomes a <b>bridge</b> between two carbon groups: an ether. 🌉",
s:["<b>Charge up 🔋</b> R–OH + Na → R–O⁻Na⁺ (and ½H₂ bubbles off).","<b>Swing in 🎯</b> RO⁻ attacks the carbon of R′–X from the back (S<sub>N</sub>2).","<b>Bridge 🌉</b> X⁻ leaves, and O now links R and R′."],
r:["Use a <b>methyl or 1°</b> halide","2°/3° halide → alkene (E2) instead","Bulky group goes on the alkoxide"],q:"How do you make tert-butyl methyl ether?",a:"Use t-BuONa + CH₃Br. The reverse (NaOCH₃ + t-BuBr) gives an alkene by elimination.",m:[["RO","#7c3aed"],["Br","#c2410c"]]},
{g:2,e:"🏗️",n:"Aldol",eq:["2 CH₃CHO","dil. NaOH","CH₃CH(OH)CH₂CHO"],ex:"Heat it: → CH₃CH=CHCHO + H₂O (aldol condensation)",
f:"The carbon next to C=O (the <b>α-carbon</b>) has an H that is easy to steal. Base steals it, leaving a carbon with spare electrons (an <b>enolate</b>). That carbon attacks a second aldehyde's slightly positive C=O carbon and builds a brand-new C–C bond. The product holds an <b>ald</b>ehyde and an alcoh<b>ol</b>: an aldol! 🏗️",
s:["<b>Steal 🥷</b> OH⁻ removes an α-H, giving a resonance-stabilised enolate.","<b>Attack 🎯</b> The enolate's α-carbon bonds to the C=O carbon of a second aldehyde, forming an alkoxide.","<b>Grab H 💧</b> The alkoxide takes H⁺ from water to give a β-hydroxy aldehyde. Heat removes H₂O to make C=C."],
r:["Needs at least one α-H","Dilute base: aldol. Heat: loses H₂O","HCHO and PhCHO cannot do it"],q:"Why can benzaldehyde not do aldol?",a:"It has no α-hydrogen, so no enolate can form."},
{g:2,e:"⚖️",n:"Cannizzaro",eq:["2 HCHO","conc. NaOH","CH₃OH + HCOONa"],ex:"2 C₆H₅CHO → C₆H₅CH₂OH + C₆H₅COONa",
f:"Aldehydes with no α-H cannot make an enolate, so in strong base they trade roles: one molecule <b>gives away</b> a hydride (H⁻), the other <b>takes</b> it. The giver becomes an acid salt (oxidised), the taker becomes an alcohol (reduced). Same molecule, opposite jobs: a self-redox! 🎭",
s:["<b>Attack 🎯</b> OH⁻ adds to the C=O carbon, forming a tetrahedral alkoxide.","<b>Hydride hop 🐸</b> That intermediate pushes out H⁻, which lands on the C=O carbon of a second aldehyde.","<b>Roles split 🎭</b> The first becomes a carboxylate (RCOO⁻); the second becomes an alkoxide, then an alcohol with water."],
r:["Only aldehydes with <b>no α-H</b>","Concentrated NaOH/KOH","Disproportionation: half acid, half alcohol"],q:"Products of 2 HCHO + NaOH?",a:"CH₃OH (reduced) + HCOONa (oxidised)."},
{g:1,e:"🧬",n:"Wurtz–Fittig",eq:["Ar–X + R–X + 2Na","dry ether","Ar–R + 2NaX"],f:"Wurtz's trick, but with one aryl partner and one alkyl partner. Na turns the aryl halide into an electron-rich Ar⁻, which attacks the alkyl halide (the easier S<sub>N</sub>2 partner) to give an alkylbenzene. Expect Ar–Ar and R–R as side products. 🧬",s:["<b>Donate ⚡</b> Na turns Ar–X into Ar–Na.","<b>Attack 🎯</b> Ar⁻ hits R–X from the back (S<sub>N</sub>2).","<b>Join 🔗</b> Ar–R forms and NaX drops out."],r:["Fittig: 2 Ar–X + 2Na → Ar–Ar (biphenyl)","Dry ether"],q:"Bromobenzene + CH₃Br + Na gives?",a:"Toluene (C₆H₅–CH₃)."},
{g:2,e:"🛑",n:"Rosenmund",eq:["RCOCl + H₂","Pd/BaSO₄","RCHO + HCl"],f:"An acid chloride wants to be reduced all the way to an alcohol. We <b>poison</b> the catalyst (BaSO₄ plus quinoline or sulphur) so it stops at the aldehyde, like a brake. 🛑",s:["<b>Adsorb 🧲</b> RCOCl and H₂ stick to Pd.","<b>Swap 🔁</b> Cl is replaced by H.","<b>Brake ✋</b> Poisoned Pd cannot reduce RCHO further."],r:["Partially poisoned Pd on BaSO₄","Benzoyl chloride → benzaldehyde"],q:"Why poison the catalyst?",a:"Otherwise the aldehyde over-reduces to a primary alcohol."},
{g:2,e:"🪄",n:"Stephen",eq:["R–C≡N","SnCl₂ + HCl, then H₃O⁺","R–CHO"],f:"SnCl₂/HCl is a gentle reducer: it adds H to the nitrile and stops at an <b>imine</b>. Water then swaps C=NH for C=O. 🪄",s:["<b>Reduce ➕</b> RCN + 2[H] → RCH=NH.","<b>Stop ✋</b> Mild SnCl₂ cannot push on to the amine.","<b>Hydrolyse 💧</b> H₃O⁺ turns C=NH into C=O."],r:["Nitrile → aldehyde","Reagent: SnCl₂ + HCl"],q:"Why not LiAlH₄?",a:"It would reduce all the way to an amine."},
{g:2,e:"🔆",n:"Etard",eq:["C₆H₅CH₃","CrO₂Cl₂ in CS₂, then H₃O⁺","C₆H₅CHO"],f:"Chromyl chloride oxidises –CH₃ on the ring, but it builds a <b>chromium complex</b> that shields the new CHO from going further. Water then releases the aldehyde. 🔆",s:["<b>Attack 🎯</b> CrO₂Cl₂ oxidises the CH₃ group.","<b>Trap 🪤</b> A brown chromium complex protects the CHO.","<b>Release 💧</b> H₃O⁺ breaks the complex: benzaldehyde."],r:["Toluene → benzaldehyde","Solvent: CS₂"],q:"Why does it stop at the aldehyde?",a:"The chromium complex blocks over-oxidation to benzoic acid."},
{g:2,e:"🧹",n:"Clemmensen & Wolff–Kishner",eq:["R₂C=O","Zn–Hg/HCl or N₂H₄/KOH","R₂CH₂"],f:"Two ways to <b>sweep the oxygen off</b> a carbonyl and leave CH₂. One uses acid, the other base, so you pick by what your molecule can survive. 🧹",s:["<b>Clemmensen 🧪</b> Zn–Hg/conc. HCl reduces C=O straight to CH₂.","<b>Wolff–Kishner 🧫</b> C=O + N₂H₄ → hydrazone (C=N–NH₂).","<b>Then 🔥</b> KOH, glycol, heat: N₂ leaves and CH₂ forms."],r:["Clemmensen = acidic; Wolff–Kishner = basic","Acetophenone → ethylbenzene"],q:"Which route for an acid-sensitive molecule?",a:"Wolff–Kishner, since it runs in base."},
{g:2,e:"🎈",n:"Hell–Volhard–Zelinsky",eq:["RCH₂COOH + X₂","red P (cat.)","RCH(X)COOH"],f:"Acids are hard to halogenate at the α-carbon. Red P makes an <b>acyl halide</b>, which enolises easily. X₂ hits the α-carbon, and water turns it back into the acid. 🎈",s:["<b>Activate ⚙️</b> RCH₂COOH + P/X₂ → RCH₂COX.","<b>Halogenate 🎯</b> The enol reacts with X₂ at the α-carbon.","<b>Hydrolyse 💧</b> RCHXCOX + H₂O → RCHXCOOH."],r:["Needs an α-H","Cl₂ or Br₂ with red P"],q:"Which carbon gets the halogen?",a:"The α-carbon, next to COOH."},
{g:3,e:"🔥",n:"Friedel–Crafts",eq:["C₆H₆ + R–Cl (or RCOCl)","anhyd. AlCl₃","C₆H₅R (or C₆H₅COR)"],f:"Benzene's ring is electron-rich but lazy. AlCl₃ yanks Cl off the reagent, making a hungry <b>R⁺</b> (or RCO⁺). The ring donates two electrons, then ejects H⁺ to stay aromatic. 🔥",s:["<b>Make the electrophile ⚙️</b> R–Cl + AlCl₃ → R⁺ + AlCl₄⁻.","<b>Ring attacks 🎯</b> π electrons bond to R⁺.","<b>Restore 💍</b> H⁺ leaves and aromaticity returns."],r:["Alkylation: R–Cl; acylation: RCOCl","Alkylation may rearrange; acylation does not"],q:"Why does acylation not rearrange?",a:"The acylium ion (RCO⁺) is resonance-stabilised."},
{g:3,e:"🧂",n:"Kolbe's",eq:["C₆H₅ONa + CO₂","400 K, 4–7 atm, then H⁺","o-HOC₆H₄COOH"],f:"Phenoxide's ring is extra electron-rich, especially at the <b>ortho</b> position. Even weak CO₂ gets attacked there. Acid then gives salicylic acid, the parent of aspirin. 💊",s:["<b>Make phenoxide 🔋</b> Phenol + NaOH → C₆H₅O⁻Na⁺.","<b>Attack 🎯</b> The ortho carbon bonds to CO₂.","<b>Acidify 🧪</b> H⁺ gives salicylic acid."],r:["Product: salicylic acid","Salicylic acid + (CH₃CO)₂O → aspirin"],q:"Why use phenoxide, not phenol?",a:"Phenoxide is far more electron-rich, so weak CO₂ can be attacked."},
{g:3,e:"🌀",n:"Reimer–Tiemann",eq:["C₆H₅OH + CHCl₃","aq. NaOH, 340 K","o-HOC₆H₄CHO"],f:"In base, chloroform loses H⁺ then Cl⁻, forming <b>dichlorocarbene (:CCl₂)</b>, a neutral but electron-hungry species. The phenoxide ring attacks it at the ortho spot, and hydrolysis turns –CHCl₂ into –CHO. 🌀",s:["<b>Carbene birth 👶</b> CHCl₃ + OH⁻ → :CCl₂ + Cl⁻ + H₂O.","<b>Ring attacks 🎯</b> The ortho carbon bonds to :CCl₂.","<b>Hydrolyse 💧</b> –CHCl₂ → –CHO: salicylaldehyde."],r:["Electrophile = :CCl₂","With CCl₄ → salicylic acid"],q:"Which species attacks the ring?",a:"Dichlorocarbene, :CCl₂."},
{g:3,e:"💨",n:"Gattermann–Koch",eq:["C₆H₆ + CO + HCl","anhyd. AlCl₃ / CuCl","C₆H₅CHO"],f:"CO and HCl team up with AlCl₃ to make the <b>formyl cation (HCO⁺)</b>, and benzene's ring attacks it. It is Friedel–Crafts that adds a CHO. 💨",s:["<b>Build HCO⁺ ⚙️</b> CO + HCl + AlCl₃ → H–C⁺=O.","<b>Ring attacks 🎯</b> π electrons bond to HCO⁺.","<b>Restore 💍</b> H⁺ leaves; benzaldehyde forms."],r:["Benzene or toluene → aromatic aldehyde","CuCl as co-catalyst"],q:"What is the electrophile?",a:"The formyl cation, HCO⁺."},
{g:4,e:"📉",n:"Hoffmann Bromamide",eq:["RCONH₂ + Br₂ + 4NaOH","heat","RNH₂ + Na₂CO₃ + 2NaBr + 2H₂O"],f:"The amide loses its C=O carbon, so the amine has <b>one carbon fewer</b>. Br₂/NaOH sets up a rearrangement where R slides from carbon to nitrogen, making an isocyanate. Water then cuts out CO₂. 📉",s:["<b>Brominate 🧪</b> RCONH₂ → RCONHBr → RCON⁻Br.","<b>Slide 🛷</b> R migrates from C to N as Br⁻ leaves: R–N=C=O.","<b>Hydrolyse 💧</b> R–NCO + OH⁻ → RNH₂ + CO₃²⁻."],r:["Amine has 1 carbon less than the amide","Gives 1° amines only"],q:"Product from propanamide?",a:"Ethanamine (C₂H₅NH₂)."},
{g:4,e:"🔐",n:"Gabriel Phthalimide",eq:["Phthalimide + KOH, then R–X","then NaOH(aq)","R–NH₂"],f:"Ammonia over-reacts into a messy mix of amines. Phthalimide is ammonia with <b>two bodyguards</b> on N, so it can be alkylated only once. Then the guards are removed. 🔐",s:["<b>Deprotonate 🔋</b> Phthalimide + KOH → potassium phthalimide.","<b>Alkylate 🎯</b> N⁻ attacks R–X (S<sub>N</sub>2).","<b>Free it 🗝️</b> NaOH(aq) strips off the phthalate, leaving RNH₂."],r:["Pure 1° aliphatic amines","Needs a 1° alkyl halide"],q:"Why can aniline not be made this way?",a:"Aryl halides do not undergo S<sub>N</sub>2, so N cannot attach to the ring."},
{g:4,e:"🤢",n:"Carbylamine",eq:["R–NH₂ + CHCl₃ + 3KOH","heat","R–NC + 3KCl + 3H₂O"],f:"Only <b>primary</b> amines have two N–H to give up. They catch :CCl₂ from CHCl₃ + KOH and become an <b>isocyanide</b>, which stinks. A smell test for 1° amines! 🤢",s:["<b>Carbene 👶</b> CHCl₃ + KOH → :CCl₂.","<b>Attack 🎯</b> RNH₂ bonds to :CCl₂ through N.","<b>Eliminate ✂️</b> Two HCl leave, giving R–N≡C."],r:["Test for 1° amines (aliphatic and aromatic)","2° and 3° amines do not respond"],q:"Why only 1° amines?",a:"They have two N–H bonds to lose; 2° and 3° amines do not."},
{g:4,e:"🎭",n:"Sandmeyer & Gattermann",eq:["ArN₂⁺Cl⁻","CuCl / CuBr / CuCN","Ar–Cl / Ar–Br / Ar–CN + N₂↑"],f:"A diazonium group is a superb leaving group: N₂ just bubbles away. That frees the ring for a new partner (Cl, Br or CN) delivered by copper. 🎭",s:["<b>Make it 🧪</b> ArNH₂ + NaNO₂ + HCl (273–278 K) → ArN₂⁺Cl⁻.","<b>Swap 🔄</b> Cu(I) delivers Cl, Br or CN to the ring.","<b>Gas escapes 💨</b> N₂ leaves and Ar–X forms."],r:["Sandmeyer: Cu(I) salts","Gattermann: Cu powder + HCl/HBr"],q:"Why keep diazotisation at 273–278 K?",a:"Above that, the diazonium salt decomposes to phenol and N₂."},
{g:4,e:"🌈",n:"Diazo Coupling",eq:["ArN₂⁺ + Ar′–OH / Ar′–NH₂","pH 9–10 (phenol), 4–5 (amine)","Ar–N=N–Ar′ (azo dye)"],f:"The diazonium ion is a weak electrophile. An electron-rich ring (phenol or aniline) attacks it at the <b>para</b> position, and the new –N=N– link makes a coloured <b>azo dye</b>. 🌈",s:["<b>Activate 🔋</b> Phenol (in base) or aniline becomes very electron-rich.","<b>Attack 🎯</b> The para carbon bonds to the terminal N of ArN₂⁺.","<b>Colour on 🎨</b> –N=N– joins both rings: an orange, red or yellow dye."],r:["Electrophile: ArN₂⁺","Couples at the para position"],q:"What makes the product coloured?",a:"Extended conjugation across the –N=N– azo link."},
{g:1,e:"⚡",n:"Kolbe Electrolysis",eq:["2 RCOO⁻Na⁺ + 2H₂O","electrolysis","R–R + 2CO₂ + H₂ + 2NaOH"],ex:"2 CH₃COONa → CH₃–CH₃ (ethane) at the anode",f:"Current strips an electron from each carboxylate. CO₂ drops off and two <b>R• radicals</b> pair up at the anode. It is Wurtz's twin, powered by electricity instead of sodium. ⚡",s:["<b>Oxidise 🔋</b> RCOO⁻ → RCOO• + e⁻ at the anode.","<b>Drop CO₂ 💨</b> RCOO• → R• + CO₂.","<b>Pair up 🔗</b> 2R• → R–R. H₂ and NaOH form at the cathode."],r:["Anode: alkane + CO₂; cathode: H₂","Even-carbon alkanes (R–R)"],q:"Product from sodium propanoate?",a:"Butane (C₂H₅–C₂H₅)."},
{g:2,e:"🍎",n:"Fischer Esterification",eq:["RCOOH + R′OH","conc. H₂SO₄, heat","RCOOR′ + H₂O"],ex:"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O",f:"Acid and alcohol join and drop a water molecule. H⁺ makes the C=O carbon more positive so the alcohol's O can attack. The acid gives the <b>OH</b>, the alcohol gives the <b>H</b>. It is reversible, so we push it forward. 🍎",s:["<b>Activate ⚙️</b> H⁺ protonates C=O, so carbon turns more electrophilic.","<b>Attack 🎯</b> R′OH adds to that carbon.","<b>Lose water 💧</b> H₂O leaves and H⁺ is released: the ester forms."],r:["Reversible equilibrium","Esters smell fruity"],q:"How do you get more ester?",a:"Use excess alcohol or remove water as it forms (Le Chatelier)."},
{g:2,e:"🧯",n:"Decarboxylation",eq:["RCOONa + NaOH","CaO (soda lime), heat","R–H + Na₂CO₃"],ex:"CH₃COONa + NaOH → CH₄ + Na₂CO₃",f:"Heating a sodium carboxylate with <b>soda lime</b> (NaOH + CaO) snaps the carboxyl group off as carbonate. The alkane left has <b>one carbon fewer</b>. CaO keeps the mixture dry and spares the glass. 🧯",s:["<b>Mix 🥣</b> RCOONa with soda lime.","<b>Heat 🔥</b> The C–COO⁻ bond breaks.","<b>Release 💨</b> R–H escapes as gas; Na₂CO₃ stays behind."],r:["Alkane has 1 carbon less","Soda lime = NaOH + CaO"],q:"Sodium benzoate + soda lime gives?",a:"Benzene (C₆H₆)."},
{g:5,e:"💛",n:"Iodoform Test",eq:["R–CO–CH₃ + 3I₂ + 4NaOH","warm","RCOONa + CHI₃↓ + 3NaI + 3H₂O"],ex:"CH₃COCH₃ → CHI₃ (yellow) + CH₃COONa",f:"In base, iodine replaces all three H of a CH₃ next to C=O. The –CI₃ group then leaves as <b>CHI₃</b>, a yellow solid with an antiseptic smell. 💛",s:["<b>Iodinate 🧪</b> All three α-H of CH₃CO– are replaced by I.","<b>Cleave ✂️</b> OH⁻ attacks C=O and CI₃⁻ leaves.","<b>Result 💛</b> Yellow CHI₃↓ and RCOO⁻."],r:["Positive: CH₃CO– or CH₃CH(OH)–","Ethanol ✓, methanol ✗, acetaldehyde ✓"],q:"Why does ethanol pass but propan-1-ol fail?",a:"I₂/NaOH oxidises ethanol to CH₃CHO, which has CH₃CO–. Propan-1-ol gives CH₃CH₂CHO, which does not."},
{g:5,e:"🪞",n:"Tollens' & Fehling's",eq:["RCHO","[Ag(NH₃)₂]⁺ or Cu²⁺, OH⁻","RCOO⁻ + Ag↓ or Cu₂O↓"],ex:"CH₃CHO + 2[Ag(NH₃)₂]⁺ + 3OH⁻ → CH₃COO⁻ + 2Ag↓ + 4NH₃ + 2H₂O",f:"Aldehydes are easy to oxidise, so they <b>reduce</b> a mild oxidant and leave a visible trail: a silver mirror or red Cu₂O. Ketones resist oxidation and stay silent. 🪞",s:["<b>Oxidise 🔋</b> RCHO → RCOO⁻.","<b>Reduce ⬇️</b> Ag⁺ → Ag, or Cu²⁺ → Cu₂O.","<b>Look 👀</b> Silver mirror (Tollens) or red-brown ppt (Fehling)."],r:["Ketones: no reaction","Benzaldehyde: Tollens ✓, Fehling ✗"],q:"Which test separates benzaldehyde from acetaldehyde?",a:"Fehling's: acetaldehyde gives red Cu₂O, benzaldehyde does not."},
{g:5,e:"⏱️",n:"Lucas Test",eq:["R–OH","conc. HCl + ZnCl₂","R–Cl (turbid)"],ex:"(CH₃)₃C–OH → (CH₃)₃C–Cl: cloudy at once",f:"ZnCl₂ helps OH leave and HCl supplies Cl⁻. The more stable the carbocation, the faster the reaction, so <b>3° is fastest</b>. The insoluble alkyl chloride turns the mixture cloudy. ⏱️",s:["<b>Activate ⚙️</b> ZnCl₂ + HCl turn –OH into a good leaving group.","<b>Leave 🚪</b> H₂O departs, giving a carbocation (S<sub>N</sub>1 for 2° and 3°).","<b>Cloud ☁️</b> Cl⁻ attacks and oily R–Cl makes it turbid."],r:["3° at once, 2° in about 5 min, 1° none at room temp","Alcohol must dissolve in the reagent"],q:"Which alcohol turns turbid first?",a:"The tertiary one, because its carbocation is the most stable."},
{g:5,e:"🕵️",n:"Hinsberg Test",eq:["1° / 2° / 3° amine","C₆H₅SO₂Cl, then NaOH","sulphonamide (or none)"],ex:"C₆H₅NH₂ + C₆H₅SO₂Cl → C₆H₅SO₂NHC₆H₅, soluble in alkali",f:"Benzenesulphonyl chloride sorts amines by their <b>N–H count</b>. A 1° product keeps one acidic N–H and dissolves in alkali. A 2° product has none left and stays solid. A 3° amine has no N–H to lose, so nothing reacts. 🕵️",s:["<b>React 🧪</b> 1° and 2° amines lose HCl with C₆H₅SO₂Cl.","<b>Add alkali 🧂</b> 1°: the acidic N–H lets the sulphonamide dissolve.","<b>Read 👀</b> 2°: insoluble solid. 3°: no reaction."],r:["1° dissolves, 2° does not, 3° no reaction","Hinsberg's reagent = C₆H₅SO₂Cl"],q:"A product dissolves in NaOH. Which amine class?",a:"Primary: its sulphonamide keeps an acidic N–H."},
{g:3,e:"🏭",n:"Cumene Process",eq:["C₆H₅CH(CH₃)₂ (cumene)","1) O₂ (air)  2) H₃O⁺","C₆H₅OH + CH₃COCH₃"],ex:"Benzene + propene → cumene → phenol + acetone (the industrial route)",f:"Factories make phenol from cheap benzene and propene. Air oxidises cumene's weak benzylic C–H to a <b>hydroperoxide</b>. Acid then makes the phenyl group slide onto oxygen and the molecule splits into <b>two useful products</b>: phenol and acetone. 🏭",s:["<b>Build 🧱</b> Benzene + propene (H₃PO₄) → cumene (isopropylbenzene).","<b>Oxidise 💨</b> O₂ turns cumene into cumene hydroperoxide.","<b>Split ✂️</b> H₃O⁺ rearranges and cleaves it into phenol and acetone."],r:["Cumene = isopropylbenzene","Two products: phenol + acetone"],q:"Why is cumene isopropyl, not propyl?",a:"Propene + H⁺ forms the more stable 2° carbocation, (CH₃)₂CH⁺, which attacks the ring."},
{g:4,e:"🛡️",n:"Balz–Schiemann",eq:["ArN₂⁺Cl⁻","HBF₄, then heat","Ar–F + BF₃ + N₂↑"],ex:"C₆H₅N₂⁺BF₄⁻ → C₆H₅F + BF₃ + N₂",f:"Copper-based exchange does not give Ar–F, so Sandmeyer is no use here. Instead HBF₄ turns the diazonium into a stable, insoluble <b>fluoroborate</b> salt. Heating it makes N₂ leave and F⁻ jump across from BF₄⁻. 🛡️",s:["<b>Swap anion 🔁</b> ArN₂⁺Cl⁻ + HBF₄ → ArN₂⁺BF₄⁻↓ + HCl.","<b>Heat 🔥</b> The salt decomposes and N₂ leaves.","<b>F jumps 🦘</b> F⁻ from BF₄⁻ bonds to the ring, leaving BF₃."],r:["Makes Ar–F","Heat the isolated fluoroborate salt"],q:"Why not Sandmeyer for fluorobenzene?",a:"Copper-based exchange does not give Ar–F, so use HBF₄ and heat instead."}];
